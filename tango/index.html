<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Um tango só nosso</title>
<meta name="description" content="Uma raposinha e uma corujinha dançando tango dentro de uma carta.">
<meta property="og:title" content="Um tango só nosso">
<meta property="og:description" content="Clique para começar a dança ♥">
<meta name="theme-color" content="#2a1d14">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 30'><path d='M16 28C6 20 1 14 2 8 3 3 9 1 13 4c2 1.5 3 3 3 4 0-1 1-2.5 3-4 4-3 10-1 11 4 1 6-4 12-14 20z' fill='%23a8383d'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2622;
    --paper:#ece4d3;
    --paper-dark:#d9ccb3;
    --red:#a8383d;
    --beat:.5s;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    font-family:'Caveat',cursive;color:var(--ink);
    background:
      radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 30%, rgba(0,0,0,.65) 100%),
      repeating-linear-gradient(97deg, rgba(255,220,180,.025) 0 2px, rgba(0,0,0,.05) 2px 5px, rgba(0,0,0,0) 5px 11px),
      repeating-linear-gradient(95deg, #3a281b 0 40px, #33231a 40px 90px, #3d2a1c 90px 130px),
      #35251a;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
    padding:16px;
  }
  .wrap{
    width:min(640px, 100%);
    filter:drop-shadow(0 18px 30px rgba(0,0,0,.55)) drop-shadow(0 2px 3px rgba(0,0,0,.4));
    transform:rotate(-1.2deg);
    animation:arrive 1.2s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes arrive{from{opacity:0;transform:translateY(40px) rotate(-4deg)}}
  .paper{
    position:relative;
    padding:clamp(22px,5vw,44px) clamp(18px,5vw,46px) clamp(20px,4vw,34px);
    background:
      radial-gradient(ellipse at 18% 12%, rgba(160,130,90,.18), transparent 40%),
      radial-gradient(ellipse at 85% 80%, rgba(150,120,80,.22), transparent 45%),
      radial-gradient(circle at 70% 25%, rgba(120,95,60,.10), transparent 18%),
      radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(120,90,50,.28) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .2  0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
      var(--paper);
    cursor:pointer;
  }
  .stage{position:relative;margin-top:clamp(24px,5vw,40px)}
  .stage svg.scene{display:block;width:100%;height:auto;overflow:visible}
  .prompt{
    text-align:center;font-size:clamp(25px,6vw,34px);font-weight:600;margin:2px 0 0;
    min-height:1.3em;transition:opacity .5s, transform .5s;
  }
  .prompt span{display:inline-block;animation:breathe 2.2s ease-in-out infinite}
  .prompt.hide{opacity:0;transform:translateY(6px)}
  @keyframes breathe{50%{transform:scale(1.06) rotate(-1deg)}}
  .count{position:absolute;left:clamp(18px,5vw,46px);bottom:clamp(14px,3vw,22px);font-size:20px;opacity:.6}
  .sound{
    position:absolute;top:clamp(16px,4vw,30px);right:clamp(16px,4vw,32px);
    font:inherit;font-size:22px;color:var(--ink);background:none;border:none;cursor:pointer;opacity:.75;padding:4px 6px;
  }
  .sound s{text-decoration-thickness:2px}

  /* ---------- corações ---------- */
  .heart{position:fixed;left:0;top:0;width:26px;height:24px;pointer-events:none;z-index:5;will-change:transform,opacity}
  .heart svg{width:100%;height:100%;display:block;overflow:visible}

  /* ---------- dança ---------- */
  #couple{transform-origin:272px 380px}
  #fox{transform-origin:190px 378px;transition:transform .18s cubic-bezier(.3,1.4,.5,1)}
  #owl{transform-origin:360px 376px;transition:transform .18s cubic-bezier(.3,1.4,.5,1)}
  #tail{transform-origin:168px 312px}
  #foxHead{transform-origin:198px 226px}
  #owlWing{transform-origin:296px 304px}
  #owlWing2{transform-origin:356px 296px}
  #bounce{transform-origin:272px 380px}

  .idle #tail{animation:swish 3.2s ease-in-out infinite alternate}
  .idle #foxHead{animation:nod 4s ease-in-out infinite}

  .dancing #bounce{animation:bounce var(--beat) cubic-bezier(.2,.7,.4,1) infinite}
  .dancing #tail{animation:swish calc(var(--beat)*2) ease-in-out infinite alternate}
  .dancing #foxHead{animation:nod calc(var(--beat)*4) ease-in-out infinite}
  .dancing #owlWing2{animation:flutter calc(var(--beat)*2) ease-in-out infinite}

  .m-caminata #couple{animation:caminata calc(var(--beat)*8) infinite}
  .m-giro #couple{animation:giro calc(var(--beat)*4) cubic-bezier(.6,0,.3,1) infinite}
  .m-ochos #owl{animation:ochos calc(var(--beat)*2) cubic-bezier(.6,0,.3,1) infinite}
  .m-ochos #fox{animation:ochosFox calc(var(--beat)*2) cubic-bezier(.6,0,.3,1) infinite}
  .m-boleo #owl{animation:boleo calc(var(--beat)*2) cubic-bezier(.3,0,.3,1) infinite}
  .m-boleo #fox{animation:lean calc(var(--beat)*2) ease-in-out infinite}
  .m-boleo #owlWing2{animation:flap calc(var(--beat)*1) ease-in-out infinite}

  .pose #fox{transform:translateX(6px) rotate(7deg)}
  .pose #owl{transform:translateX(-10px) rotate(7deg)}
  .pose #tail{transform:rotate(-14deg)}

  .hop #bounce{animation:hop .45s cubic-bezier(.3,0,.3,1)}

  @keyframes bounce{0%{transform:translateY(-4px)}35%{transform:translateY(0)}}
  @keyframes swish{from{transform:rotate(-9deg)}to{transform:rotate(8deg)}}
  @keyframes nod{0%,100%{transform:rotate(0)}30%{transform:rotate(-4deg)}65%{transform:rotate(3deg)}}
  @keyframes flutter{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
  @keyframes flap{0%,100%{transform:rotate(0)}50%{transform:rotate(-34deg)}}
  @keyframes caminata{
    0%{transform:translateX(0)}
    12.5%{transform:translateX(-16px) rotate(-1deg);animation-timing-function:cubic-bezier(.6,0,.3,1)}
    25%{transform:translateX(-34px) rotate(-2deg)}
    37.5%{transform:translateX(-34px) rotate(0)}
    50%{transform:translateX(0)}
    62.5%{transform:translateX(16px) rotate(1deg)}
    75%{transform:translateX(34px) rotate(2deg)}
    87.5%{transform:translateX(34px) rotate(0)}
    100%{transform:translateX(0)}
  }
  @keyframes giro{0%{transform:scaleX(1)}40%,50%{transform:scaleX(-1) translateY(-6px)}90%,100%{transform:scaleX(1)}}
  @keyframes ochos{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
  @keyframes ochosFox{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-3deg)}}
  @keyframes boleo{0%{transform:translateY(0)}25%{transform:translateY(-24px) rotate(-9deg)}50%,100%{transform:translateY(0) rotate(0)}}
  @keyframes lean{0%,100%{transform:rotate(0)}25%{transform:rotate(5deg)}}
  @keyframes hop{40%{transform:translateY(-22px) rotate(-2deg)}}

  @media (prefers-reduced-motion: reduce){
    .wrap{animation:none}
    .m-giro #couple{animation:none}
  }
</style>
</head>

<script>
(() => {
  const BPM = 120, BEAT = 60 / BPM;
  document.documentElement.style.setProperty('--beat', BEAT + 's');

  const $ = id => document.getElementById(id);
  const scene = $('scene'), prompt = $('prompt'), paper = $('paper');
  const turb = $('turb'), soundBtn = $('sound'), countEl = $('count');

  /* ---------- bordas de papel rasgado ---------- */
  function tearEdges(){
    const pts = [], n = 46, j = () => (Math.random() * 1.1).toFixed(2);
    for (let i = 0; i <= n; i++) pts.push(`${(i / n * 100).toFixed(2)}% ${j()}%`);
    for (let i = 0; i <= n; i++) pts.push(`${(100 - j() * .8).toFixed(2)}% ${(i / n * 100).toFixed(2)}%`);
    for (let i = n; i >= 0; i--) pts.push(`${(i / n * 100).toFixed(2)}% ${(100 - j()).toFixed(2)}%`);
    for (let i = n; i >= 0; i--) pts.push(`${(j() * .8).toFixed(2)}% ${(i / n * 100).toFixed(2)}%`);
    paper.style.clipPath = `polygon(${pts.join(',')})`;
  }
  tearEdges();

  /* ---------- traço "vivo" de desenho à mão ---------- */
  let seed = 1, boilEvery = 260;
  (function boil(){ seed = (seed % 6) + 1; turb.setAttribute('seed', seed); setTimeout(boil, boilEvery); })();

  /* ---------- corações ---------- */
  const HEART = '<svg viewBox="0 0 32 30"><path d="M16 28C6 20 1 14 2 8 3 3 9 1 13 4c2 1.5 3 3 3 4 0-1 1-2.5 3-4 4-3 10-1 11 4 1 6-4 12-14 20z" fill="FILL" stroke="#2b2622" stroke-width="1.8" stroke-linejoin="round"/></svg>';
  let hearts = 0;
  function heartAt(x, y, opts = {}){
    const el = document.createElement('div');
    el.className = 'heart';
    const fills = ['rgba(168,56,61,.75)', 'rgba(168,56,61,.45)', 'none', 'rgba(168,56,61,.6)'];
    el.innerHTML = HEART.replace('FILL', fills[Math.random() * fills.length | 0]);
    const s = (opts.scale || 1) * (0.6 + Math.random() * 0.8);
    document.body.appendChild(el);
    const rise = opts.rise || (140 + Math.random() * 160);
    const dx = (Math.random() - .5) * (opts.spread || 120);
    const rot = (Math.random() - .5) * 50;
    const dur = 2200 + Math.random() * 1600;
    el.animate([
      { transform: `translate(${x - 13}px, ${y - 12}px) scale(${s * .3}) rotate(0deg)`, opacity: 0 },
      { transform: `translate(${x - 13 + dx * .3}px, ${y - 12 - rise * .2}px) scale(${s}) rotate(${rot * .3}deg)`, opacity: 1, offset: .15 },
      { transform: `translate(${x - 13 - dx * .2}px, ${y - 12 - rise * .6}px) scale(${s}) rotate(${-rot * .4}deg)`, opacity: .9, offset: .6 },
      { transform: `translate(${x - 13 + dx}px, ${y - 12 - rise}px) scale(${s * .8}) rotate(${rot}deg)`, opacity: 0 }
    ], { duration: dur, easing: 'cubic-bezier(.2,.6,.4,1)', delay: opts.delay || 0, fill: 'both' }).onfinish = () => el.remove();
    hearts++;
    if (hearts > 1) countEl.textContent = `♥ × ${hearts}`;
  }
  function sceneToPage(sx, sy){
    const r = scene.getBoundingClientRect();
    return [r.left + (sx - 25) / 460 * r.width, r.top + (sy - 60) / 340 * r.height];
  }
  function heartsFromCouple(n = 1, spread = 120){
    for (let i = 0; i < n; i++){
      const [x, y] = sceneToPage(268 + (Math.random() - .5) * 40, 150 + (Math.random() - .5) * 30);
      heartAt(x, y, { spread, delay: i * 70 });
    }
  }
  function heartRain(n = 40){
    for (let i = 0; i < n; i++){
      heartAt(Math.random() * innerWidth, innerHeight * (.5 + Math.random() * .6),
        { rise: innerHeight * (.6 + Math.random() * .5), spread: 160, delay: i * 60, scale: 1.2 });
    }
  }

  /* ---------- música: tango sintetizado ---------- */
  let ctx = null, master = null, wet = null, reed = null, muted = false;
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  function ensureAudio(){
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4;
    master = ctx.createGain(); master.gain.value = muted ? 0 : .8;
    master.connect(comp); comp.connect(ctx.destination);
    // reverb de sala pequena
    const len = ctx.sampleRate * 1.8, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++){
      const d = ir.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
    }
    const conv = ctx.createConvolver(); conv.buffer = ir;
    wet = ctx.createGain(); wet.gain.value = .22;
    wet.connect(conv); conv.connect(master);
    // timbre de palheta (bandoneón)
    const h = [0, 1, .75, .55, .5, .32, .3, .2, .16, .12, .1, .08, .06, .05];
    reed = ctx.createPeriodicWave(new Float32Array(h.length), new Float32Array(h));
  }
  function out(node){ node.connect(master); node.connect(wet); }

  function bando(t, d, m, v = .16){
    const g = ctx.createGain(), lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 2600; lp.Q.value = .6;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + .035);
    g.gain.setTargetAtTime(v * .8, t + .05, .3);
    g.gain.setValueAtTime(v * .8, t + Math.max(.06, d - .05));
    g.gain.linearRampToValueAtTime(0, t + d + .06);
    const lfo = ctx.createOscillator(), lg = ctx.createGain();
    lfo.frequency.value = 5.4; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(d > .6 ? 9 : 2, t + Math.min(d, .5));
    lfo.connect(lg);
    [[1, -7, .5], [1, 7, .5], [.5, 3, .3]].forEach(([mul, det, gv]) => {
      const o = ctx.createOscillator(), og = ctx.createGain();
      o.setPeriodicWave(reed); o.frequency.value = hz(m) * mul; o.detune.value = det;
      lg.connect(o.detune);
      og.gain.value = gv; o.connect(og); og.connect(lp);
      o.start(t); o.stop(t + d + .1);
    });
    lfo.start(t); lfo.stop(t + d + .1);
    lp.connect(g); out(g);
  }
  function pluck(t, m, v, decay = .32, type = 'triangle'){
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.type = type; o.frequency.value = hz(m);
    o2.type = 'sine'; o2.frequency.value = hz(m) * 2;
    const g2 = ctx.createGain(); g2.gain.value = .25;
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(3200, t); lp.frequency.exponentialRampToValueAtTime(700, t + decay);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .006);
    g.gain.exponentialRampToValueAtTime(.0008, t + decay);
    o.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); out(g);
    o.start(t); o2.start(t); o.stop(t + decay + .05); o2.stop(t + decay + .05);
  }
  const chord = (t, notes, v = .05, dec = .28) => notes.forEach(n => pluck(t, n, v, dec));
  const bass = (t, m, v = .32) => pluck(t, m, v, .42, 'sine');

  const C = {
    Dm: { b: 38, n: [57, 62, 65] }, Gm: { b: 43, n: [55, 58, 62] },
    A7: { b: 45, n: [55, 61, 64] }, Bb: { b: 46, n: [58, 62, 65] }
  };
  const PROG = ['Dm', 'Gm', 'A7', 'Dm', 'Bb', 'Gm', 'A7', 'Dm'];
  // [início em tempos, duração, nota MIDI]
  const PHRASES = [
    [ [[0,1.5,69],[1.5,.5,74],[2,1,77],[3,.5,76],[3.5,.5,74]],
      [[0,.75,70],[.75,.25,69],[1,1,67],[2,1.5,74],[3.5,.5,70]],
      [[0,1.5,73],[1.5,.5,76],[2,1,79],[3,.5,77],[3.5,.5,76]],
      [[0,2,77],[2,.5,74],[2.5,.5,76],[3,.5,77],[3.5,.5,81]],
      [[0,1.5,77],[1.5,.5,74],[2,1,70],[3,.5,74],[3.5,.5,77]],
      [[0,1.5,79],[1.5,.25,77],[1.75,.25,76],[2,1,74],[3,1,70]],
      [[0,.5,69],[.5,.5,73],[1,.5,76],[1.5,.5,79],[2,1.5,81],[3.5,.5,79]],
      [[0,1.5,74]] ],
    [ [[0,.5,74],[.5,.5,77],[1,2,81],[3,.5,79],[3.5,.5,77]],
      [[0,1.5,79],[1.5,.5,82],[2,.5,81],[2.5,.5,79],[3,1,77]],
      [[0,1.5,76],[1.5,.5,79],[2,1,82],[3,.5,81],[3.5,.5,79]],
      [[0,3,81],[3,.5,77],[3.5,.5,76]],
      [[0,.75,74],[.75,.25,77],[1,1.5,82],[2.5,.5,81],[3,.5,79],[3.5,.5,77]],
      [[0,.5,79],[.5,.5,77],[1,.5,76],[1.5,.5,74],[2,2,70]],
      [[0,1,73],[1,1,76],[2,1,81],[3,1,85]],
      [[0,1.5,86]] ],
    [ [[0,.25,74],[.5,.25,74],[1,.25,74],[1.5,.25,76],[2,.75,77],[2.75,.25,76],[3,1,74]],
      [[0,.25,70],[.5,.25,70],[1,.25,70],[1.5,.25,72],[2,.75,74],[2.75,.25,72],[3,1,70]],
      [[0,.25,69],[.5,.25,69],[1,.25,73],[1.5,.25,76],[2,.75,79],[2.75,.25,77],[3,1,76]],
      [[0,.75,77],[.75,.25,76],[1,.5,74],[1.5,.5,69],[2,2,74]],
      [[0,.25,77],[.5,.25,77],[1,.25,77],[1.5,.25,79],[2,.75,81],[2.75,.25,79],[3,1,77]],
      [[0,.25,79],[.5,.25,79],[1,.25,79],[1.5,.25,81],[2,.75,82],[2.75,.25,81],[3,1,79]],
      [[0,.25,76],[.5,.25,76],[1,.25,79],[1.5,.25,82],[2,1,81],[3,.5,79],[3.5,.5,76]],
      [[0,.5,74],[.5,.5,69],[1,.75,74]] ]
  ];

  function schedulePhrase(p, t0){
    const mel = PHRASES[p % PHRASES.length];
    PROG.forEach((name, bar) => {
      const c = C[name], tb = t0 + bar * 4 * BEAT, last = bar === 7;
      mel[bar].forEach(([s, d, m]) => bando(tb + s * BEAT, d * BEAT, m));
      if (last){
        bass(tb, c.b); chord(tb, c.n, .045);
        bass(tb + BEAT, c.b + 7); chord(tb + BEAT, c.n, .035);
        // chan-chan!
        const tA = tb + 2 * BEAT, tD = tb + 3 * BEAT;
        bass(tA, 33, .4); bass(tA, 45, .25); chord(tA, [57, 61, 64, 67], .07, .22); bando(tA, .18, 73, .2);
        bass(tD, 26, .45); bass(tD, 38, .3); chord(tD, [57, 62, 65, 69], .08, .3); bando(tD, .22, 74, .22);
        return;
      }
      if (bar % 2 === 0){ // marcato em 4
        [0, 1, 2, 3].forEach(k => {
          bass(tb + k * BEAT, k === 2 ? c.b + 7 : c.b, k % 2 ? .24 : .34);
          chord(tb + k * BEAT, c.n, k % 2 ? .032 : .05);
        });
      } else { // síncopa 3-3-2
        [[0, c.b], [1.5, c.b], [3, c.b + 7]].forEach(([k, m]) => {
          bass(tb + k * BEAT, m, .34); chord(tb + k * BEAT, c.n, .05);
        });
      }
    });
  }

  /* ---------- coreografia ---------- */
  const MOVES = ['m-caminata', 'm-ochos', 'm-giro', 'm-boleo'];
  let state = 'idle', phrase = 0, timers = [], beatTimer = null;
  const later = (ms, fn) => timers.push(setTimeout(fn, ms));
  const setClasses = (...cls) => scene.setAttribute('class', ['scene', ...cls].join(' '));

  function startPhrase(){
    ensureAudio();
    state = 'dancing';
    prompt.classList.add('hide');
    boilEvery = 140;
    const lead = 0.12;
    if (ctx) schedulePhrase(phrase, ctx.currentTime + lead);
    const ms = b => (lead + b * BEAT) * 1000;
    const m1 = MOVES[(phrase * 2) % 4], m2 = MOVES[(phrase * 2 + 1) % 4];
    later(ms(0), () => {
      setClasses('dancing', m1);
      heartsFromCouple(3);
      beatTimer = setInterval(() => heartsFromCouple(1, 90), BEAT * 1000 * 2);
    });
    later(ms(16), () => setClasses('dancing', m2));
    later(ms(30), () => { clearInterval(beatTimer); setClasses(); heartsFromCouple(3); });
    later(ms(31), () => { setClasses('pose'); heartsFromCouple(12, 200); });
    later(ms(32.6), () => {
      state = 'paused'; boilEvery = 260; phrase++;
      prompt.innerHTML = '<span>clique para continuar a dança ♥</span>';
      prompt.classList.remove('hide');
    });
  }

  function hop(){
    scene.classList.remove('hop'); void scene.getBoundingClientRect(); scene.classList.add('hop');
    setTimeout(() => scene.classList.remove('hop'), 460);
  }

  paper.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    if (state === 'dancing'){
      for (let i = 0; i < 5; i++) heartAt(e.clientX, e.clientY, { delay: i * 50, spread: 140 });
      if (scene.classList.contains('dancing')) hop();
      return;
    }
    timers.forEach(clearTimeout); timers = [];
    startPhrase();
  });

  soundBtn.addEventListener('click', e => {
    e.stopPropagation();
    muted = !muted;
    soundBtn.innerHTML = muted ? '♪ <s>som</s>' : '♪ som';
    if (master) master.gain.setTargetAtTime(muted ? 0 : .8, ctx.currentTime, .05);
  });

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    document.hidden ? ctx.suspend() : ctx.resume();
  });
})();
</script>
